{{ define "main" }}
<article class="about-page">
  <header class="about-header">
    <div class="about-header__copy">
      <p class="eyebrow">{{ upper (i18n "about") }}</p>
      <h1>{{ .Title }}</h1>
      <p class="lede">{{ .Description }}</p>
      <a class="about-linkedin" href="https://fr.linkedin.com/in/kevinbrunet" target="_blank" rel="me noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.3 7.9H1.7V19h3.6V7.9ZM3.5 2.4a2.1 2.1 0 1 0 0 4.2 2.1 2.1 0 0 0 0-4.2ZM22.3 12.6c0-3.4-1.8-5-4.3-5-2 0-2.9 1.1-3.4 1.9V7.9H11V19h3.6v-5.5c0-1.5.3-2.9 2.1-2.9 1.8 0 1.9 1.7 1.9 3V19h3.6l.1-6.4Z"/></svg>
        <span>{{ i18n "linkedin_profile" }}</span>
      </a>
    </div>
    <figure class="about-portrait">
      <img src="{{ "/images/kevin-brunet.jpg" | relURL }}" alt="{{ i18n "portrait_alt" }}">
    </figure>
  </header>
  <div class="about-content prose">{{ .Content }}</div>
</article>
{{ end }}
