{{- $src := .Get "src" -}}
{{- $alt := .Get "alt" -}}
{{- $action := .Get "action" -}}
{{- $label := .Get "label" -}}
{{- $size := .Get "size" | default "wide" -}}
{{- if not (in (slice "wide" "compact") $size) -}}
  {{- errorf "zoomable-figure: invalid size %q in %s" $size .Position -}}
{{- end -}}
<figure class="article-zoomable article-zoomable--{{ $size }}">
  <a href="{{ $src }}" target="_blank" rel="noopener" aria-label="{{ $label }}">
    <img src="{{ $src }}" alt="{{ $alt }}" loading="lazy">
    <span class="article-zoomable__action">{{ $action }} <b aria-hidden="true">↗</b></span>
  </a>
  <figcaption>{{ .Inner | plainify }}</figcaption>
</figure>
