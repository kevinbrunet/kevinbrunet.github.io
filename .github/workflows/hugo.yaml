name: Déployer Hugo sur GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    # GitHub utilise UTC. Ces deux passages couvrent 08:00 à Paris été comme hiver.
    - cron: '0 6,7 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.schedule.outputs.should_run }}
    steps:
      - name: Vérifier l'heure de publication
        id: schedule
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "schedule" || "$(TZ=Europe/Paris date +%H)" == "08" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.schedule.outputs.should_run == 'true'
      - uses: peaceiris/actions-hugo@6b1ee2dcc06c9b6629a5317fa0146473914d05e1 # v3
        if: steps.schedule.outputs.should_run == 'true'
        with:
          hugo-version: '0.148.1'
          extended: true
      - id: pages
        if: steps.schedule.outputs.should_run == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - if: steps.schedule.outputs.should_run == 'true'
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: steps.schedule.outputs.should_run == 'true'
        with:
          path: ./public
  deploy:
    if: needs.build.outputs.should_run == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
